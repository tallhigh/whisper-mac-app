# The Xcode project is generated from this file: `make generate` (xcodegen).
# WhisperTranscriber.xcodeproj is not committed — the pbxproj is never hand-edited.
# Rationale: docs/DECISIONS.md → ADR-011.

name: WhisperTranscriber

options:
  bundleIdPrefix: com.talhaturhan
  # The source language is English: it is the app's only language and the base any
  # translation would be added against. Must match Localizable.xcstrings's sourceLanguage.
  developmentLanguage: en
  createIntermediateGroups: true
  deploymentTarget:
    # 14.2 is where the Core Audio process tap API arrived and 14.4 where the audio-capture
    # permission flow settled (docs/LIVE_TRANSCRIPTION.md → Audio sources).
    macOS: "14.4"
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Version.xcconfig
  Release: Version.xcconfig

settings:
  base:
    ARCHS: arm64
    DEVELOPMENT_TEAM: AL9CGWVTYB
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    # Extracts the user-facing strings into Localizable.xcstrings.
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_ENABLE_MODULE_VERIFIER: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Debug:
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      # Manual signing with the Developer ID; no provisioning profile is needed
      # (see docs/BUILD_AND_RELEASE.md).
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Developer ID Application"
      PROVISIONING_PROFILE_SPECIFIER: ""
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  WhisperTranscriber:
    type: application
    platform: macOS
    sources:
      - path: WhisperTranscriber
        excludes:
          - "Resources/bin/**"
          - "**/.DS_Store"

      # The embedded uv binary → Contents/MacOS/uv
      # Downloaded by `make bootstrap`; not committed.
      - path: WhisperTranscriber/Resources/bin/uv
        buildPhase:
          copyFiles:
            destination: executables
            subpath: ""

      # The Python worker → Contents/Resources/python/
      # The single source of truth is the python/ directory at the repository root.
      - path: ../python/whisper_worker.py
        buildPhase:
          copyFiles:
            destination: resources
            subpath: python
      - path: ../python/requirements.txt
        buildPhase:
          copyFiles:
            destination: resources
            subpath: python

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.talhaturhan.WhisperTranscriber
        PRODUCT_NAME: WhisperTranscriber
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Talha Turhan"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        CODE_SIGN_ENTITLEMENTS: WhisperTranscriber/WhisperTranscriber.entitlements
        # The icon is generated by `scripts/make_icon.swift` — `make icon`.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES

    info:
      path: WhisperTranscriber/Info.plist
      properties:
        CFBundleDisplayName: Whisper Transcriber
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleDevelopmentRegion: en
        # The text shown in the microphone permission dialog. Without it the app crashes.
        NSMicrophoneUsageDescription: "Whisper Transcriber needs the microphone to record audio and transcribe it. The recording is processed only on this Mac."
        # The repository link in the About tab. With it empty, no link is shown.
        WTRepositoryURL: "https://github.com/tallhigh/whisper-mac-app"
        # For "Open With" in Finder and dragging onto the Dock.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio or video file
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
              - public.movie
              - public.mpeg-4-audio
              - public.mp3
              - com.microsoft.waveform-audio

  WhisperTranscriberTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: WhisperTranscriberTests
    dependencies:
      - target: WhisperTranscriber
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.talhaturhan.WhisperTranscriberTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: NO

schemes:
  WhisperTranscriber:
    build:
      targets:
        WhisperTranscriber: all
        WhisperTranscriberTests: [test]
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - WhisperTranscriberTests
